# =============================================================================
# fxcast - PEN/USD exchange rate forecasting pipeline
# Standard: PEP 621 (project metadata) + PEP 735 (dependency groups).
# =============================================================================

[build-system]
# Backend that turns src/ into an installable wheel. uv_build is uv's own
# backend: fast, src-layout by default. Upper bound avoids surprise breaking
# changes from a future major/minor of the backend.
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project]
name = "fxcast"
version = "0.1.0"
description = "PEN/USD exchange rate forecasting with BCRP data: baselines to CNN-LSTM."
readme = "README.md"
license = "MIT"
# Floor at 3.11 (CI matrix 3.11-3.13); local dev pinned to 3.12 via .python-version.
requires-python = ">=3.11"
# Runtime deps only. Add each one when a step needs it, never "just in case".
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "typer>=0.29.2",
    "tzdata>=2026.6",
]

[project.scripts]
# Entry point: installing the package creates the `fxcast` command in the venv.
# Format "module.path:object" -> runs fxcast/cli.py's `app`.
fxcast = "fxcast.cli:app"

[dependency-groups]
# Dev-only tools; NOT shipped with the package (PEP 735).
# `uv sync` installs the `dev` group by default.
dev = [
    "mypy>=2.4.1",
    "nbstripout>=0.9.2",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
# Exploration only (notebooks/). Not installed by default, so CI and Docker
# stay lean. Opt in: uv run --project pipeline --group notebooks jupyter lab
notebooks = [
    "jupyterlab>=4.6.6",
]

# =============================================================================
# Tooling configuration (single file, no .flake8 / mypy.ini / pytest.ini)
# =============================================================================

[tool.ruff]
# Match requires-python floor: ruff won't suggest syntax 3.11 can't run.
target-version = "py311"
# 88 (black) forces too many wraps in pandas/numpy chains; 100 is common in data.
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle errors / warnings
    "F",      # pyflakes: real bugs (unused imports, undefined names)
    "I",      # isort: import ordering
    "B",      # flake8-bugbear: subtle bugs (mutable defaults, bare except...)
    "UP",     # pyupgrade: modern syntax for target-version
    "SIM",    # flake8-simplify
    "N",      # pep8-naming
    "RUF",    # ruff-specific rules
    "PT",     # flake8-pytest-style
    "NPY",    # numpy rules, e.g. legacy np.random.seed (matters for fixed seeds)
]
# Deliberately not selected yet: D (docstrings, noisy early), ANN (mypy covers
# it), PD (pandas-vet, many false positives).

[tool.mypy]
python_version = "3.11"
# strict = every check on (no untyped defs, no implicit Any, ...).
# Easier to start strict than to tighten later.
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# Tests don't need full annotations on every fixture; src/ does.
module = "tests.*"
disallow_untyped_defs = false

# Third-party libs without type information, one module at a time
# (never a global ignore_missing_imports: it silently disables checking).
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]  # ships no py.typed / stubs as of 26.0
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: summary of skipped/failed tests at the end.
# --strict-markers / --strict-config: typos in markers or config FAIL
#   instead of being silently ignored.
# --import-mode=importlib: recommended for src layout (no sys.path hacks).
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "integration: hits the real BCRP API (deselected in CI: -m 'not integration')",
]
